name: Windows folder mount pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/folder-mount-pilot.yml
      - tests/folder-sharing/**
      - src/ssh.rs
      - src/ssh/**
      - Cargo.lock

permissions:
  contents: read

concurrency:
  group: folder-mount-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  guest:
    name: Build the Linux SSHFS guest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Build kernel and initramfs
        run: sudo bash tests/folder-sharing/guest/build.sh "$RUNNER_TEMP/sshfs-guest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sshfs-guest
          path: ${{ runner.temp }}/sshfs-guest/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  mount:
    name: Read a Windows fixture through a real Linux FUSE mount
    needs: guest
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sshfs-guest
          path: ${{ runner.temp }}/sshfs-guest
      - name: Install Rust
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
      - name: Build the native SSH fixture
        run: |
          $messages = cargo test --locked --lib --no-run --message-format=json-render-diagnostics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $binary = @($messages | ConvertFrom-Json | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.profile.test -and
            $_.target.name -eq 'w11term' -and $_.executable
          })
          if ($binary.Count -ne 1) { throw 'Expected one w11term library test executable' }
          "MOUNT_TEST_EXE=$($binary[0].executable)" >> $env:GITHUB_ENV
      - name: Install QEMU for the disposable runner
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-qemu
      - name: Locate the native QEMU executable
        shell: msys2 {0}
        run: |
          qemu=$(command -v qemu-system-x86_64.exe)
          "$qemu" --version
          echo "MOUNT_TEST_QEMU=$(cygpath -w "$qemu")" >> "$GITHUB_ENV"
      - name: Mount, read, unmount and check the original SSH shell
        run: |
          ./tests/folder-sharing/run-windows.ps1 -GuestDirectory "$env:RUNNER_TEMP/sshfs-guest" `
            -QemuExecutable $env:MOUNT_TEST_QEMU -TestExecutable $env:MOUNT_TEST_EXE
