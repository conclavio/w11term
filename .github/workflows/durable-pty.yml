name: Durable Linux PTY
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check the editor, image and input after losing the PTY client
        run: sh tests/durable/run-linux.sh
      - name: Discover and attach to an existing stock tmux session
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tmux
          python3 tests/durable/tmux_existing.py
