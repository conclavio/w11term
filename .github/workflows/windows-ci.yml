name: Windows CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: 1.98.0
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  test:
    name: Windows unit and loopback tests
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - &checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Rust, rustfmt, Clippy and coverage tools
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - &cargo-cache
        name: Cache Cargo downloads
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check all targets with Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Install the coverage reporter
        run: cargo install cargo-llvm-cov --version 0.9.2 --locked
      - name: Run unit and integration tests with line coverage
        run: cargo llvm-cov --locked --all-targets --all-features --lcov --output-path "$env:RUNNER_TEMP/coverage.lcov"
      - name: Summarize Rust suite coverage
        run: |
          cargo llvm-cov report --json --summary-only --output-path "$env:RUNNER_TEMP/coverage.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $report = Get-Content -Raw "$env:RUNNER_TEMP/coverage.json" | ConvertFrom-Json
          $src = (Resolve-Path src).Path + [IO.Path]::DirectorySeparatorChar
          $files = @($report.data[0].files | Where-Object { [IO.Path]::GetFullPath($_.filename).StartsWith($src, [StringComparison]::OrdinalIgnoreCase) })
          $total = ($files | ForEach-Object { $_.summary.lines.count } | Measure-Object -Sum).Sum
          $covered = ($files | ForEach-Object { $_.summary.lines.covered } | Measure-Object -Sum).Sum
          if (!$total) { throw 'No w11term source files were present in the coverage report.' }
          "Rust unit and integration tests covered **$covered / $total** instrumented lines in w11term src (**$([math]::Round(100 * $covered / $total, 1))%**)." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-rust-coverage
          path: |
            ${{ runner.temp }}/coverage.lcov
            ${{ runner.temp }}/coverage.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
  native-e2e:
    name: Windows native end-to-end tests
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - *checkout
      - name: Install Rust
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
      - *cargo-cache
      - name: Build the GUI, CLI and loopback SSH peer
        run: cargo build --locked --features ui-smoke --bins --example echo_server
      - name: Set the desktop size for native resize and accessibility assertions
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Check the native fixtures' keyboard messages
        run: ./tests/fixture-keyboard-messages.ps1
      - name: Verify native SSH and ConPTY workflows, command notifications, durable panes and accessibility
        env:
          W11TERM_VERIFY_HOSTED_PASTE: '1'
        run: cargo test --locked --features ui-smoke --test accessibility --test durable_ssh --test sftp -- --ignored --test-threads=1
      - name: Verify server-required SSH factors with an independent loopback peer
        run: |
          $env:PYTHONPATH = "$env:RUNNER_TEMP/ssh-factor-fixture"
          python -m pip install --only-binary=:all: --target $env:PYTHONPATH paramiko==4.0.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --features ui-smoke --test player_ssh key_second_factor:: -- --ignored --test-threads=1
      - name: Copy Unicode text through the real OSC 52 clipboard path
        run: |
          Set-Clipboard -Value 'w11term clipboard fixture'
          cargo test --locked --features ui-smoke --lib clipboard::tests::native_osc52_roundtrip_preserving_existing_plain_text -- --ignored --exact
      - name: Verify the elevated control pipe rejects a medium-integrity client
        run: cargo test --locked --features ui-smoke --lib control::security::tests::native_high_server_refuses_medium_integrity_client -- --ignored --exact
      - name: Drive the GUI over its control pipe
        run: ./tests/control-smoke.ps1 -Configuration debug
      - name: Exercise tabs, font settings, search and authentication prompts
        run: ./tests/lab-ui-smoke.ps1
      - name: Split native panes
        run: ./tests/split-ui-smoke.ps1
      - name: Save and reopen native workspaces
        run: ./tests/workspace-ui-smoke.ps1
      - name: Edit profiles and connect to the loopback peer
        run: ./tests/profile-ui-smoke.ps1
      - name: Import OpenSSH profiles through the GUI
        run: ./tests/openssh-import-ui-smoke.ps1
      - name: Edit and select named keyboard hints through the GUI
        run: powershell.exe -NoProfile -NonInteractive -STA -File ./tests/hint-patterns-ui.ps1 -VerifyClipboard
      - name: Compose and commit text through the native IME interface
        run: ./tests/ime-ui-smoke.ps1
      - name: Build the mux replay test using the existing native build
        run: |
          cargo test --locked --features ui-smoke --test remote_mux --no-run
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $binary = @(Get-ChildItem target/debug/deps/remote_mux-*.exe)
          if ($binary.Count -ne 1) { throw "Expected one mux replay test executable" }
          Copy-Item -LiteralPath $binary[0].FullName -Destination "$env:RUNNER_TEMP/mux-replay.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-mux-replay
          path: ${{ runner.temp }}/mux-replay.exe
          if-no-files-found: error
          retention-days: 1
      - name: Save failing GUI logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-gui-logs
          path: |
            .local/*smoke*/**/*.log
            .local/*smoke*/**/*.err
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  durable-linux:
    uses: ./.github/workflows/durable-pty.yml

  shell-directory:
    name: Bash, Zsh and Fish directory reporting
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - *checkout
      - name: Install missing shells from Ubuntu
        run: |
          missing=()
          for candidate in zsh fish; do
            command -v "$candidate" >/dev/null || missing+=("$candidate")
          done
          if (( ${#missing[@]} )); then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends "${missing[@]}"
          fi
      - name: Exercise directory reporting in interactive shells
        run: python3 tests/shell-directory.py
      - name: Exercise SSH dotfile startup in Fish
        run: python3 tests/fish-dotfiles.py
      - name: Exercise Fish 4 native and fallback prompt marking
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/src:ro" --workdir /src ubuntu:26.04 bash -euc '
            apt-get -o Acquire::Retries=3 update
            apt-get -o Acquire::Retries=3 install -y --no-install-recommends fish python3
            python3 tests/shell-directory.py --shell fish
            python3 tests/fish-dotfiles.py
          '

  linux-triage:
    name: Linux performance triage script
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - *checkout
      - name: Verify samples, deadline and cleanup with Linux shell utilities
        run: python3 tests/linux-triage.py
      - name: Verify CPU profile identity, byte limits, deadline and cleanup
        run: python3 tests/linux-cpu-profile.py
      - name: Verify CPU command arguments, exit status and cleanup
        run: python3 tests/linux-cpu-launch.py
      - name: Resolve a live CPU hotspot with perf
        shell: bash
        run: |
          previous=$(sysctl -n kernel.perf_event_paranoid)
          if (( previous > 2 )); then
            trap 'sudo sysctl -q -w "kernel.perf_event_paranoid=$previous"' EXIT
            sudo sysctl -q -w kernel.perf_event_paranoid=2
          fi
          python3 tests/linux-cpu-profile.py --live
          python3 tests/linux-cpu-launch.py --live

  linux-packet-capture:
    name: Linux loopback packet capture
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - *checkout
      - name: Install tcpdump if needed
        shell: bash
        run: |
          if ! command -v tcpdump >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends tcpdump
          fi
      - name: Verify loopback bytes, scratch budget and disconnect cleanup
        run: sudo python3 tests/linux-packet-capture.py

  linux-syscall-capture:
    name: Linux bounded syscall capture
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - *checkout
      - name: Install strace if needed
        shell: bash
        run: |
          if ! command -v strace >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends strace
          fi
      - name: Verify raw descendants, time and byte caps, Stop and disconnect
        run: python3 tests/linux-syscall-capture.py

  remote-mux:
    name: Stock Linux multiplexers over SSH
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - *checkout
      - name: Exercise input, resize and graphics on both sides of a loopback SSH PTY
        run: bash tests/durable/run-mux-linux.sh artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: remote-mux-frames
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  kitty-reference:
    uses: ./.github/workflows/kitty-graphics.yml

  mux-replay:
    name: Replay stock mux frames on Windows
    needs: [remote-mux, native-e2e]
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: remote-mux-frames
          path: frames
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-mux-replay
      - name: Verify query replies, input, pane resize and rendered Sixel placement
        env:
          W11_MUX_CAPTURES: frames
        run: ./mux-replay.exe --ignored

  package:
    uses: ./.github/workflows/windows-package.yml

  release-order:
    name: Verify Windows release ordering
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - *checkout
      - run: python3 -B -m unittest discover -s tests -p test_release_order.py

  publish:
    name: Publish the verified merge build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, native-e2e, durable-linux, shell-directory, kitty-reference, mux-replay, package, release-order]
    concurrency:
      group: publish-windows-release
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Identify the merged pull request for this main commit
        id: merge
        run: |
          prs=$(gh api --paginate --slurp "repos/$GH_REPO/commits/$GITHUB_SHA/pulls")
          number=$(jq -r --arg sha "$GITHUB_SHA" \
            '[.[][] | select(.merged_at and .base.ref == "main" and .merge_commit_sha == $sha)][0].number // empty' <<< "$prs")
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Download the archive from this run
        if: steps.merge.outputs.number != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: w11term-windows-x64
          path: release
      - name: Publish ZIP and SHA-256
        if: steps.merge.outputs.number != ''
        working-directory: release
        env:
          PR_NUMBER: ${{ steps.merge.outputs.number }}
        run: |
          set -euo pipefail
          archive=w11term-windows-x64.zip
          sha256sum --check "$archive.sha256"
          tag="build-${GITHUB_SHA:0:12}"
          if details=$(gh release view "$tag" --json isDraft,assets); then
            if [[ $(jq -r '.isDraft' <<< "$details") == false ]]; then
              jq -e --arg zip "$archive" \
                '[.assets[] | select(.size > 0) | .name] | contains([$zip, ($zip + ".sha256")])' <<< "$details"
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft \
              --title "w11term for Windows x64 · ${GITHUB_SHA:0:12}" \
              --notes "Built from $GITHUB_SHA after merging #$PR_NUMBER. Extract the complete ZIP and launch w11term.exe."
          fi
          gh release upload "$tag" "$archive" "$archive.sha256" --clobber
          gh release edit "$tag" --draft=false --latest=false
      - name: Fetch current main history and published tags
        if: steps.merge.outputs.number != ''
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: refs/heads/main
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Mark the newest verified main build as Latest
        if: steps.merge.outputs.number != ''
        working-directory: source
        run: |
          git switch --detach "$GITHUB_SHA"
          python3 scripts/promote_windows_release.py
