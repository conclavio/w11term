[package]
authors = ["Wez Furlong"]
name = "wezterm-cell"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/wezterm/wezterm"
description = "Model a Cell in a Terminal display"
license = "MIT"
documentation = "https://docs.rs/wezterm-cell"
keywords = ["terminal", "cell"]

[dependencies]
finl_unicode = { version = "1.3", git = "https://github.com/wez/finl_unicode.git", branch = "no_std", default-features = false, features = ["categories", "grapheme_clusters"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"], optional = true }
log = { version = "0.4", optional = true }
ordered-float = { version = "4.1", default-features = false, optional = true }
sha2 = { version = "0.10", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "rc"], optional = true }
thiserror = { version = "2.0", optional = true }
wezterm-blob-leases = { git = "https://github.com/wezterm/wezterm", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", optional = true }
wezterm-char-props = { git = "https://github.com/wezterm/wezterm", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", default-features = false }
wezterm-color-types = { git = "https://github.com/wezterm/wezterm", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", default-features = false }
wezterm-escape-parser = { path = "../wezterm-escape-parser" }
wezterm-dynamic = { git = "https://github.com/wezterm/wezterm", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", default-features = false }

[features]
std = ["serde/std", "wezterm-char-props/std", "wezterm-color-types/std", "wezterm-escape-parser/std", "wezterm-dynamic/std", "finl_unicode/std"]
use_serde = ["dep:serde", "wezterm-color-types/use_serde"]
use_image = ["dep:image", "dep:wezterm-blob-leases", "dep:log", "dep:ordered-float", "dep:sha2", "dep:thiserror"]
