[package]
authors = ["Wez Furlong <wez@wezfurlong.org>"]
name = "wezterm-term"
version = "0.1.0"
edition = "2018"
repository = "https://github.com/wezterm/wezterm"
description = "The Virtual Terminal Emulator core from wezterm; helpful for implementing terminal emulators"
license = "MIT"
documentation = "https://docs.rs/wezterm-term"
keywords = ["terminal", "emulator", "vte"]
readme = "README.md"

[features]
use_serde = ["termwiz/use_serde", "wezterm-cell/use_serde", "wezterm-escape-parser/use_serde", "wezterm-surface/use_serde"]

[dependencies]
anyhow = "1"
bitflags = "1.3"
csscolorparser = "0.6"
downcast-rs = "1"
finl_unicode = { version = "1.3", git = "https://github.com/wez/finl_unicode.git", branch = "no_std", default-features = false, features = ["categories", "grapheme_clusters"] }
hex = { version = "0.4", default-features = false }
humansize = "2.1"
image = "0.25"
lazy_static = "1.4"
log = "0.4"
lru = "0.16"
miniz_oxide = "0.7"
num-traits = { version = "0.2", default-features = false }
ordered-float = { version = "4.1", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "rc"] }
terminfo = "0.9"
unicode-normalization = "0.1.24"
url = "2"
wezterm-bidi = { git = "https://github.com/wezterm/wezterm", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb" }
wezterm-dynamic = { git = "https://github.com/wezterm/wezterm", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", features = ["std"] }
wezterm-cell = { git = "https://github.com/wezterm/wezterm", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", features = ["std", "use_image"] }
wezterm-escape-parser = { git = "https://github.com/wezterm/wezterm", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", features = ["std", "use_image"] }
wezterm-surface = { git = "https://github.com/wezterm/wezterm", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", features = ["std", "appdata", "use_image"] }

[dev-dependencies]
env_logger = "0.11"
k9 = "0.12"

[dependencies.termwiz]
git = "https://github.com/wezterm/wezterm"
rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb"
features = ["use_image"]
